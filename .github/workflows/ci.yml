name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wake-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wake-engine
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
